/* INFO GRID */

/* PIANO */

    justify-content: center; */

.piano {

.white-key {

    float: left;

}

.black-key {
    /* width: 30px; */

    background: black;

    top: 0;
}

/* 3 OCTAVES BLACK KEYS */
.b1{left:35px;} .b2{left:85px;}
.b3{left:185px;} .b4{left:235px;} .b5{left:285px;}

.b6{left:385px;} .b7{left:435px;}
.b8{left:535px;} .b9{left:585px;} .b10{left:635px;}

.b11{left:735px;} .b12{left:785px;}
.b13{left:885px;} .b14{left:935px;} .b15{left:985px;}

.piano-wrapper {
    width: 100%;
    padding-bottom: 5px;
    padding-right: 15px;

    box-sizing: border-box;

.white-key.active {

}

.black-key.active {

}

.sruthi-btn {

    background: #ccc;          /* default gray */
    border: none;
    border-radius: 4px;

}

.sruthi-btn.active {
    background: #2ecc71;       /* green */

}
.oct-btn {
    padding: 8px 16px;
    margin: 6px;
    background: #ccc;      /* gray */

    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;

.oct-btn.active {
    background: #3498db;   /* blue (or green if you want) */
    color: #fff;
}
.lang-btn {
    padding: 8px 16px;
    /* margin: 6px; */
    margin-bottom: 6px;
    background: #ccc;      /* gray */
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

.lang-btn.active {
    background: #3498db;   /* blue (or green if you want) */
    color: #fff;
}


</style>
</head>

<body onload="
    document.querySelector('#octaveButtons .oct-btn').click();
    document.querySelector('#sruthiButtons .sruthi-btn').click();
    document.querySelector('#langButtons .lang-btn').click();
">


<!-- TOP BAR -->
<div class="top-bar">

</div>

<!-- BASIC INFO -->
<div class="info-grid">

    <div class="info-box">Number: <span id="ragaNumber"></span></div>
    <div class="info-box">Chakra: <span id="ragaChakra"></span></div>
</div>

<!-- AROHANA / AVAROHANA TEXT -->
<div class="swara-section">
    <div>
        <h3>ఆరోహణ(Arohana) : <span id="arohanaText"></span></h3>
    </div>
    <div>
        <h3>అవరోహణ(Avarohana) : <span id="avarohanaText"></span></h3>
    </div>
</div>

<div style="text-align:center; margin-top:10px;display: flex; justify-content: space-between;">
    <div id="octaveButtons" style="display: flex; justify-content: center;">
        <p style="font-weight: bold;">స్థాయి/Octave ➔</p>

            onclick="selectOctave(this, 3)">3 OCT</button>

    </div>
    <div id="langButtons" style="display: flex;justify-content: center;">

            onclick="selectlang(this, 'te')">Telugu</button>

        <button class="lang-btn"
            onclick="selectlang(this, 'en')">English</button>
    </div>
    <div id="sruthiButtons" style="display: flex;justify-content: center;">
        <p style="font-weight: bold;">శ్రుతి/scales ➔</p>
        <button class="sruthi-btn"
            onclick="selectSruthi(this, 'C')">1 / C</button>
        <button class="sruthi-btn"
            onclick="selectSruthi(this, 'C#')">1½ / C#</button>
        <button class="sruthi-btn"
            onclick="selectSruthi(this, 'D')">2 / D</button>
        <button class="sruthi-btn"
            onclick="selectSruthi(this, 'D#')">2½ / D#</button>
        <button class="sruthi-btn"
            onclick="selectSruthi(this, 'E')">3 / E</button>
        <button class="sruthi-btn"
            onclick="selectSruthi(this, 'F')">4 / F</button>
        <button class="sruthi-btn"
            onclick="selectSruthi(this, 'F#')">4½ / F#</button>
        <button class="sruthi-btn"
            onclick="selectSruthi(this, 'G')">5 / G</button>
        <button class="sruthi-btn"
            onclick="selectSruthi(this, 'G#')">5½ / G#</button>
        <button class="sruthi-btn"
            onclick="selectSruthi(this, 'A')">6 / A</button>
        <button class="sruthi-btn"
            onclick="selectSruthi(this, 'A#')">6½ / A#</button>
        <button class="sruthi-btn"
            onclick="selectSruthi(this, 'B')">7 / B</button>
    </div>

</div>

<!-- PIANO SECTION -->
<div class="piano-section">
    <span style="font-size: 20px; color: black; font-family: Lucida Grande; font-weight: bold; text-align: left;">ఆరోహణ(Arohana). ====&#62;</span>
    <div class="piano-wrapper">
        <div class="piano" id="pianoArohana"></div>
    </div>
    
    <span style="font-size: 20px; color: black; font-family: Lucida Grande; font-weight: bold; text-align: left;">అవరోహణ(Avarohana). &#60;====</span>

   <div class="piano" id="pianoAvarohana"></div>

</div>

<div><button class="back-btn" onclick="goBack()">⬅ Back</button></div>
<script src="ragas.js"></script>

<script>
let lang = "te"
let octaves = 3
let sruthi = "C"
/* GET RAGA NAME FROM URL */
const params = new URLSearchParams(window.location.search);
const ragaName = params.get("name");

/* FIND RAGA */
const raga = carnatic_ragas.find(r => r.name === ragaName);

/* FILL DATA */
if (raga) {
    document.getElementById("ragaName").textContent = raga.name;
    document.getElementById("ragaType").textContent = raga.type;
    document.getElementById("ragaNumber").textContent = raga.number ?? "-";
    document.getElementById("ragaChakra").textContent = raga.chakra ?? "-";
    document.getElementById("arohanaText").textContent = raga.Arohana.join(" ");
    document.getElementById("avarohanaText").textContent = raga.Avarohana.join(" ");
}

/* BACK */
function goBack() {
    window.location.href = "index.html";
}

// piano creation
const WHITE_PER_OCT = 7;
const BLACK_POS = [0, 1, 3, 4, 5];
const WHITE_WIDTH = 50;
const BLACK_WIDTH = 30;

const sruthis = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const availableKeys = ["S","R1","R2","R3","G1","G2","G3","M1","M2","P","D1","D2","D3","N1","N2","N3","S*"];

function setOctave(pitch_type, oct, aro, selectedSruthi) {
    buildPiano(pitch_type, oct, aro , selectedSruthi);
}

function calculateArohanaIndexes(arohana, octaves, selectedSruthi) {

    const sruthiIndex = sruthis.indexOf(selectedSruthi);
    const base = (octaves === 3) ? 13 : 25;
    const middle = base + 7; // your P logic

    const indexes = [];

    arohana.forEach(swara => {

        if (swara === "S" || swara === "S*") {
            indexes.push(base + sruthiIndex);
            return;
        }
        const idx = availableKeys.indexOf(swara);

        if (swara.startsWith("R")) {
            indexes.push(base + sruthiIndex + idx);
        }
        else if (swara.startsWith("G")) {
            indexes.push(base + sruthiIndex + idx - 2);
        }
        else if (swara.startsWith("M")) {
            indexes.push(base + sruthiIndex + idx - 2);
        }
        else if (swara === "P") {
            indexes.push(middle + sruthiIndex);
        }
        else if (swara.startsWith("D")) {
            indexes.push(base + sruthiIndex + idx - 2);
        }
        else if (swara.startsWith("N")) {
            indexes.push(base + sruthiIndex + idx - 4);
        }
    });
    indexes.push(base + 12 + sruthiIndex)
    return indexes;
}


function buildPiano(containerId, octaves, arohana, selectedSruthi = "C") {
    const telugu_sy={"S":"స", "R":"రి", "G":"గ", "M":"మ", "P":"ప", "D":"ద", "N":"ని"}

    const piano = document.getElementById(containerId);
    piano.innerHTML = "";

    const WHITE_PER_OCT = 7;
    const BLACK_AFTER = [0, 1, 3, 4, 5];

    const DEFAULT_WHITE_WIDTH = 50;
    const BLACK_RATIO = 0.6;

    const totalWhiteKeys = octaves * WHITE_PER_OCT;
    const screenWidth = piano.parentElement.clientWidth;

    let whiteWidth = DEFAULT_WHITE_WIDTH;
    if (totalWhiteKeys * DEFAULT_WHITE_WIDTH > screenWidth) {
        whiteWidth = screenWidth / totalWhiteKeys;
    }

    const blackWidth = whiteWidth * BLACK_RATIO;

    piano.style.position = "relative";
    piano.style.width = (totalWhiteKeys * whiteWidth) + "px";
    piano.style.height = "210px";
    piano.style.margin = "5px auto";

    const highlightIndexes = calculateArohanaIndexes(arohana, octaves, selectedSruthi);

    let whiteIndex = 0;
    let globalKeyIndex = 1; // IMPORTANT: counts white + black

    for (let o = 0; o < octaves; o++) {
        for (let w = 0; w < WHITE_PER_OCT; w++) {

            // WHITE KEY
            const white = document.createElement("div");
            white.className = "white-key";
            white.style.width = whiteWidth + "px";
            white.style.height = "200px";

            if (highlightIndexes.includes(globalKeyIndex)) {
                white.style.background = "hsl(196, 54%, 74%)";
                const note = arohana[highlightIndexes.indexOf(globalKeyIndex)] || "S*";
            if (lang === "te") {
                const base = note.replace(/[^SRGMPDN]/g, "");  
                const teluguBase = telugu_sy[base] || "స";
                white.textContent = note.replace(base, teluguBase)

            } else {
                white.textContent = note;
            }



                white.style.fontWeight = "bold";
                white.style.display = "flex";
                white.style.alignItems = "center";
                white.style.justifyContent = "center";
                white.style.color = "red";
            }

            piano.appendChild(white);
            globalKeyIndex++;

            // BLACK KEY
            if (BLACK_AFTER.includes(w)) {
                const black = document.createElement("div");
                black.className = "black-key";
                black.style.width = blackWidth + "px";
                black.style.left =
                    (whiteIndex * whiteWidth + whiteWidth - blackWidth / 2) + "px";

                if (highlightIndexes.includes(globalKeyIndex)) {
                    black.style.background = "aqua";
                    const note = arohana[highlightIndexes.indexOf(globalKeyIndex)] || "S*";

                    if (lang === "te") {
                        const base = note.replace(/[^SRGMPDN]/g, "");  // Extract base swara (S, R, G, M, P, D, N)
                        const teluguBase = telugu_sy[base] || "స";
                        black.textContent = note.replace(base, teluguBase)

                    } else {
                        black.textContent = note;
                    }
                    black.style.color = "red";
                    black.style.fontSize = "12px";
                    black.style.fontWeight = "bold"
                    black.style.display = "flex";
                    black.style.alignItems = "center";
                    black.style.justifyContent = "center";
                    black.style.fontSize = "15px";
                    black.style.border = "1px solid black"
                }

                piano.appendChild(black);
                globalKeyIndex++;
            }

            whiteIndex++;
        }
    }
}

setOctave("pianoArohana", 3 , aro=raga.Arohana);
setOctave("pianoAvarohana", 3 , aro=raga.Avarohana)

function selectSruthi(button, newSruthi) {
    sruthi = newSruthi
    // 🔴 remove active from all buttons
    document.querySelectorAll('.sruthi-btn').forEach(btn => {
        btn.classList.remove('active');
    });

    // 🟢 add active to clicked button
    button.classList.add('active');

    // 👉 call your existing logic
    setOctave(
        'pianoArohana',
        octaves,
        raga.Arohana,
        sruthi
    );
    setOctave(
        'pianoAvarohana',
        octaves,
        raga.Avarohana,
        sruthi
    );
}

function selectOctave(button, newOctaves) {
    octaves = newOctaves
    // 🔴 remove active from all octave buttons
    document.querySelectorAll('.oct-btn').forEach(btn => {
        btn.classList.remove('active');
    });

    // 🟢 activate clicked one
    button.classList.add('active');

    // 👉 call your existing function
    setOctave(
        'pianoArohana',
        octaves,
        raga.Arohana
    );
    setOctave(
        'pianoAvarohana',
        octaves,
        raga.Avarohana
    );
}
function selectlang(button, newlang) {
    lang = newlang
    // 🔴 remove active from all octave buttons
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.remove('active');
    });

    // 🟢 activate clicked one
    button.classList.add('active');

    // 👉 call your existing function
    setOctave(
        'pianoArohana',
        octaves,
        raga.Arohana
    );
    setOctave(
        'pianoAvarohana',
        octaves,
        raga.Avarohana
    );
}

</script>

</body>
</html>
