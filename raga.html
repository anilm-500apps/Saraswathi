<script>
let lang = "te"
let octaves = 3
let sruthi = "C"

/* GET RAGA NAME FROM URL */
const params = new URLSearchParams(window.location.search);
const ragaName = params.get("name");
renderUsedRagas();

const btn = document.getElementById("searchBtn");
const popup = document.getElementById("searchPopup");

btn.onclick = () => {
    popup.classList.toggle("hidden");
};
const input = document.getElementById("floatingInput");
const results = document.getElementById("floatingResults");

function saveUsedRaga(name) {
    let ragas = JSON.parse(localStorage.getItem("usedRagas")) || [];

    let existing = ragas.find(r => r.name === name);

    if (existing) {
        existing.count++;
    } else {
        ragas.push({ name, count: 1 });
    }

    ragas.sort((a, b) => b.count - a.count);

    localStorage.setItem("usedRagas", JSON.stringify(ragas));
}

input.addEventListener("input", () => {
    const query = input.value.toLowerCase();
    results.innerHTML = "";

    const filtered = carnatic_ragas.filter(r =>
        r.name.toLowerCase().includes(query)
    );

    filtered.forEach(raga => {
        const li = document.createElement("li");
        li.textContent = raga.name;

        li.onclick = () => {
            saveUsedRaga(raga.name)
            window.location.href =
                `raga.html?name=${encodeURIComponent(raga.name)}`;
        };

        results.appendChild(li);
    });
});

// dragable to any where
const floating = document.getElementById("floatingSearch");

let dragging = false;
let offsetX = 0;
let offsetY = 0;

floating.addEventListener("mousedown", (e) => {
    dragging = true;
    offsetX = e.clientX - floating.offsetLeft;
    offsetY = e.clientY - floating.offsetTop;
});

document.addEventListener("mousemove", (e) => {
    if (!dragging) return;

    floating.style.left = (e.clientX - offsetX) + "px";
    floating.style.top = (e.clientY - offsetY) + "px";
    floating.style.right = "auto";
});

document.addEventListener("mouseup", () => {
    dragging = false;
});
//  dragable code end

/* FIND RAGA */
const raga = carnatic_ragas.find(r => r.name === ragaName);

// piano creation
const WHITE_PER_OCT = 7;
const BLACK_POS = [0, 1, 3, 4, 5];
const WHITE_WIDTH = 50;
const BLACK_WIDTH = 30;
const sruthis = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const availableKeys = ["S","R1","R2","R3","G1","G2","G3","M1","M2","P","D1","D2","D3","N1","N2","N3","S*"];
/* FILL DATA */
if (raga) {
    document.getElementById("ragaName").textContent = raga.name;
    document.getElementById("ragaType").textContent = raga.type;
    document.getElementById("ragaNumber").textContent = raga.number ?? "-";
    document.getElementById("ragaChakra").textContent = raga.chakra ?? "-";
    document.getElementById("arohanaText").textContent = raga.Arohana.join(" ");
    // document.getElementById("avarohanaText").textContent = raga.Avarohana.join(" ");
    document.getElementById("avarohanaText").textContent=[...raga.Avarohana].reverse().join(" ");
}

function deleteRaga(name) {
    let ragas = JSON.parse(localStorage.getItem("usedRagas")) || [];

    ragas = ragas.filter(r => r.name !== name);

    localStorage.setItem("usedRagas", JSON.stringify(ragas));

    renderUsedRagas();
}

function renderUsedRagas() {
    const bar = document.getElementById("recentBar");
    let ragas = JSON.parse(localStorage.getItem("usedRagas")) || [];

    bar.innerHTML = "";

    ragas.forEach(raga => {
        const chip = document.createElement("div");
        chip.className = "recent-chip";

        chip.innerHTML = `
            <span>${raga.name}</span>
            <span class="delete-btn">✖</span>
        `;

        chip.onclick = () => {
            window.location.href =
                `raga.html?name=${encodeURIComponent(raga.name)}`;
        };

        const del = chip.querySelector(".delete-btn");

        del.onclick = (e) => {
            e.stopPropagation(); // don't open raga
            deleteRaga(raga.name);
        };

        bar.appendChild(chip);
    });
}

/* BACK */
function goBack() {
    window.location.href = "index.html";
}

function setOctave(pitch_type, oct, aro, selectedSruthi) {
    buildPiano(pitch_type, oct, aro , selectedSruthi);
}

function calculateArohanaIndexes(arohana, octaves, selectedSruthi) {

    const sruthiIndex = sruthis.indexOf(selectedSruthi);
    const base = (octaves === 3) ? 13 : 25;
    const middle = base + 7; // your P logic

    const indexes = [];

    arohana.forEach(swara => {

        if (swara === "S" || swara === "S*") {
            indexes.push(base + sruthiIndex);
            return;
        }
        const idx = availableKeys.indexOf(swara);

        if (swara.startsWith("R")) {
            indexes.push(base + sruthiIndex + idx);
        }
        else if (swara.startsWith("G")) {
            indexes.push(base + sruthiIndex + idx - 2);
        }
        else if (swara.startsWith("M")) {
            indexes.push(base + sruthiIndex + idx - 2);
        }
        else if (swara === "P") {
            indexes.push(middle + sruthiIndex);
        }
        else if (swara.startsWith("D")) {
            indexes.push(base + sruthiIndex + idx - 2);
        }
        else if (swara.startsWith("N")) {
            indexes.push(base + sruthiIndex + idx - 4);
        }
    });
    indexes.push(base + 12 + sruthiIndex)
    return indexes;
}

function buildPiano(containerId, octaves, arohana, selectedSruthi = "C") {
    const telugu_sy={"S":"స", "R":"రి", "G":"గ", "M":"మ", "P":"ప", "D":"ద", "N":"ని"}

    const piano = document.getElementById(containerId);
    piano.innerHTML = "";

    const WHITE_PER_OCT = 7;
    const BLACK_AFTER = [0, 1, 3, 4, 5];

    const DEFAULT_WHITE_WIDTH = 50;
    const BLACK_RATIO = 0.6;

    const totalWhiteKeys = octaves * WHITE_PER_OCT;
    const screenWidth = piano.parentElement.clientWidth;

    let whiteWidth = DEFAULT_WHITE_WIDTH;
    if (totalWhiteKeys * DEFAULT_WHITE_WIDTH > screenWidth) {
        whiteWidth = screenWidth / totalWhiteKeys;
    }

    const blackWidth = whiteWidth * BLACK_RATIO;

    piano.style.position = "relative";
    piano.style.width = (totalWhiteKeys * whiteWidth) + "px";
    piano.style.height = "210px";
    piano.style.margin = "5px auto";

    const highlightIndexes = calculateArohanaIndexes(arohana, octaves, selectedSruthi);

    let whiteIndex = 0;
    let globalKeyIndex = 1; // IMPORTANT: counts white + black
    let new_steps = []
    if (containerId === "pianoAvarohana") {
            new_steps = [...arohana].reverse();
        }else{
            new_steps = arohana;
        }
    if (lang === "te") {
        raga_notes = []
        for (let i = 0; i < new_steps.length; i++) {
                const suffix = new_steps[i].slice(1);
                raga_notes.push(telugu_sy[new_steps[i][0]] + suffix);
            }
        document.getElementById(containerId.replace("pianoA","a") + "TextS").textContent = raga_notes;
    }else {
        document.getElementById(containerId.replace("pianoA","a") + "TextS").textContent = new_steps;
    }
    for (let o = 0; o < octaves; o++) {
        for (let w = 0; w < WHITE_PER_OCT; w++) {

            // WHITE KEY
            const white = document.createElement("div");
            white.className = "white-key";
            white.style.width = whiteWidth + "px";
            white.style.height = "200px";

            if (highlightIndexes.includes(globalKeyIndex)) {
                white.style.background = "hsl(196, 54%, 74%)";
                const note = arohana[highlightIndexes.indexOf(globalKeyIndex)] || "S*";
            if (lang === "te") {
                const base = note.replace(/[^SRGMPDN]/g, "");  
                const teluguBase = telugu_sy[base] || "స";
                white.textContent = note.replace(base, teluguBase)

            } else {
                white.textContent = note;
            }
                white.style.fontWeight = "bold";
                white.style.display = "flex";
                white.style.alignItems = "center";
                white.style.justifyContent = "center";
                white.style.color = "red";
            }
            // 🔊 SOUND FOR WHITE KEY
            const whiteFreq = getFrequency(globalKeyIndex, octaves);

            white.addEventListener("mousedown", () => {
                audioCtx.resume();
                activeKeys[globalKeyIndex] = playFreq(whiteFreq);
            });

            white.addEventListener("mouseup", () => {
                if (activeKeys[globalKeyIndex]) {
                    activeKeys[globalKeyIndex].stop();
                    delete activeKeys[globalKeyIndex];
                }
            });

            white.addEventListener("mouseleave", () => {
                if (activeKeys[globalKeyIndex]) {
                    activeKeys[globalKeyIndex].stop();
                    delete activeKeys[globalKeyIndex];
                }
            });

            piano.appendChild(white);
            globalKeyIndex++;

            // BLACK KEY
            if (BLACK_AFTER.includes(w)) {
                const black = document.createElement("div");
                black.className = "black-key";
                black.style.width = blackWidth + "px";
                black.style.left =
                    (whiteIndex * whiteWidth + whiteWidth - blackWidth / 2) + "px";

                if (highlightIndexes.includes(globalKeyIndex)) {
                    black.style.background = "aqua";
                    const note = arohana[highlightIndexes.indexOf(globalKeyIndex)] || "S*";

                    if (lang === "te") {
                        const base = note.replace(/[^SRGMPDN]/g, "");  // Extract base swara (S, R, G, M, P, D, N)
                        const teluguBase = telugu_sy[base] || "స";
                        black.textContent = note.replace(base, teluguBase)

                    } else {
                        black.textContent = note;
                    }
                    black.style.color = "red";
                    black.style.fontSize = "12px";
                    black.style.fontWeight = "bold"
                    black.style.display = "flex";
                    black.style.alignItems = "center";
                    black.style.justifyContent = "center";
                    black.style.fontSize = "15px";
                    black.style.border = "1px solid black"
                }

                // 🔊 SOUND FOR BLACK KEY
                const blackFreq = getFrequency(globalKeyIndex, octaves);

                black.addEventListener("mousedown", () => {
                    audioCtx.resume();
                    activeKeys[globalKeyIndex] = playFreq(blackFreq);
                });

                black.addEventListener("mouseup", () => {
                    if (activeKeys[globalKeyIndex]) {
                        activeKeys[globalKeyIndex].stop();
                        delete activeKeys[globalKeyIndex];
                    }
                });

                black.addEventListener("mouseleave", () => {
                    if (activeKeys[globalKeyIndex]) {
                        activeKeys[globalKeyIndex].stop();
                        delete activeKeys[globalKeyIndex];
                    }
                });

                piano.appendChild(black);
                globalKeyIndex++;
            }

            whiteIndex++;
        }
    }
}

function selectSruthi(button, newSruthi) {

    sruthi = newSruthi
    // 🔴 remove active from all buttons
    document.querySelectorAll('.sruthi-btn').forEach(btn => {
        btn.classList.remove('active');
    });

    // 🟢 add active to clicked button
    button.classList.add('active');

    // 👉 call your existing logic
    setOctave(
        'pianoArohana',
        octaves,
        raga.Arohana,
        sruthi
    );
    setOctave(
        'pianoAvarohana',
        octaves,
        raga.Avarohana,
        sruthi
    );
}

function selectOctave(button, newOctaves) {
    octaves = newOctaves
    // 🔴 remove active from all octave buttons
    document.querySelectorAll('.oct-btn').forEach(btn => {
        btn.classList.remove('active');
    });

    // 🟢 activate clicked one
    button.classList.add('active');

    // 👉 call your existing function
    setOctave(
        'pianoArohana',
        octaves,
        raga.Arohana
    );
    setOctave(
        'pianoAvarohana',
        octaves,

}
function selectlang(button, newlang) {

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.remove('active');
    });

    // 🟢 activate clicked one
    button.classList.add('active');

    // 👉 call your existing function
    setOctave(
        'pianoArohana',
        octaves,
        raga.Arohana
    );
    setOctave(
        'pianoAvarohana',
        octaves,
        raga.Avarohana
    );
}
function openSongs() {
    window.location.href = `songs.html?name=${encodeURIComponent(raga.name)}`;
}

function getOctaveMultipliers(octaves) {
    if (octaves === 3) return [0.5, 1, 2];
    if (octaves === 5) return [0.25, 0.5, 1, 2, 4];
    return [1];
}

function getFrequency(globalKeyIndex, octaves) {
    const BASE_FREQ = [
        261.63, 277.18, 293.66, 311.13,
        329.63, 349.23, 369.99,
        392.00, 415.30, 440.00,
        466.16, 493.88
    ];

    const octaveMultipliers = getOctaveMultipliers(octaves);

    const keysPerOctave = 12;

    const zeroBased = globalKeyIndex - 1;
    const octaveIndex = Math.floor(zeroBased / keysPerOctave);
    const noteIndex = zeroBased % keysPerOctave;

    return BASE_FREQ[noteIndex] * octaveMultipliers[octaveIndex];
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const activeKeys = {};

const BASE_FREQ = [
    261.63, 277.18, 293.66, 311.13,
    329.63, 349.23, 369.99,
    392.00, 415.30, 440.00,
    466.16, 493.88
];
const swaraFreq = {
  "S": 261.63,
  "R1": 277.18,
  "R2": 293.66,
  "G2": 311.13,
  "G3": 329.63,
  "M1": 349.23,

function getOctaveMultipliers(octaves) {
    if (octaves === 3) return [0.5, 1, 2];
    if (octaves === 5) return [0.25, 0.5, 1, 2, 4];
    return [1];
}

function getFrequency(globalKeyIndex, octaves) {
    const multipliers = getOctaveMultipliers(octaves);
    const zeroIndex = globalKeyIndex - 1;

    const octaveIndex = Math.floor(zeroIndex / 12);
    const noteIndex = zeroIndex % 12;

    return BASE_FREQ[noteIndex] * multipliers[octaveIndex];
}

function playFreq(freq, duration = 0) {
    if (duration === 0){
        const osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = freq;
        osc.connect(audioCtx.destination);
        osc.start();
        return osc;
    }
    else {
        // duration === 2000
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.value = freq;

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + duration / 1000
        );

        osc.start();
        osc.stop(audioCtx.currentTime + duration / 1000);
    }
}

function playSequence(sequence) {
    let time = 0;
    let count = 0;
    const duration = 1000; // 2 seconds
    if (sequence=== "Arohana"){
        new_seq = raga.Arohana
    } else {
        new_seq = [...raga.Avarohana].reverse()
    }
    new_seq.forEach(swara => {
        let freq = swaraFreq[swara];
        if (!freq) return;
        if (sequence==="Arohana" & swara === "S"){
            count+=1
            if (count>1){
                freq=freq * 2
            }
        } else if(sequence === "Avarohana" & swara === "S") {
            if (count < 1){
                freq=freq * 2
            }count+=1
        }
        setTimeout(() => {
            playFreq(freq, duration);
        }, time);

        time += duration;
    });
}
